<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Landing Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c12;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #1e1f2c;
            border-radius: 32px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ffd966;
            margin-bottom: 24px;
        }
        .user-info {
            background: #2a2b3a;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 12px;
        }
        .discord-btn {
            background: #5865F2;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .discord-btn:hover {
            background: #4752c4;
            transform: scale(1.02);
        }
        .logout-btn {
            background: #ffd966;
            color: #0f0f17;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 16px;
        }
        .loading {
            color: #aaa;
            margin-top: 20px;
        }
        .calculator-placeholder {
            margin-top: 24px;
            padding: 20px;
            background: #2a2b3a;
            border-radius: 16px;
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🎯 Fortnite Landing Calculator</h1>
        <div id="content">
            <div class="loading">⏳ Загрузка...</div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const response = await fetch('/api/user');
            const data = await response.json();
            
            const contentDiv = document.getElementById('content');
            
            if (data.loggedIn) {
                // Пользователь авторизован
                const user = data.user;
                const avatarUrl = user.avatar 
                    ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';
                
                contentDiv.innerHTML = `
                    <div class="user-info">
                        <img src="${avatarUrl}" class="avatar" alt="Avatar">
                        <h3 style="color: #ffd966;">${user.global_name || user.username}</h3>
                        <p style="color: #aaa;">${user.email || 'Email не указан'}</p>
                    </div>
                    <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
                    <div class="calculator-placeholder">
                        ✅ Ты авторизован!<br>
                        🗺️ Здесь будет твой калькулятор лендинга<br>
                        📌 Копируй сюда свой HTML-код с картой
                    </div>
                `;
            } else {
                // Не авторизован — показываем кнопку входа
                contentDiv.innerHTML = `
                    <p style="color: #ccc; margin-bottom: 24px;">Войди через Discord, чтобы использовать калькулятор</p>
                    <button class="discord-btn" onclick="login()">
                        🎮 Войти через Discord
                    </button>
                `;
            }
        }
        
        function login() {
            window.location.href = '/auth/discord';
        }
        
        function logout() {
            window.location.href = '/logout';
        }
        
        checkAuth();
    </script>
</body>
</html>
