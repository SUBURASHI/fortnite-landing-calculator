<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fortnite Landing Calculator — Вход</title>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6yOEzDsQhz4alUwscnFGwTBnsdMNUB0E",
            authDomain: "fnlandcalc.firebaseapp.com",
            projectId: "fnlandcalc",
            storageBucket: "fnlandcalc.firebasestorage.app",
            messagingSenderId: "1026167412655",
            appId: "1:1026167412655:web:3372b910043c27a145015a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // DOM элементы
        const authPanel = document.getElementById('authPanel');
        const calculatorPanel = document.getElementById('calculatorPanel');
        const userInfo = document.getElementById('userInfo');
        const userNameSpan = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const userEmailSpan = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const discordLoginBtn = document.getElementById('discordLogin');
        const googleLoginBtn = document.getElementById('googleLogin');
        const epicLoginBtn = document.getElementById('epicLogin');
        const loginSubmit = document.getElementById('loginSubmit');
        const registerSubmit = document.getElementById('registerSubmit');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const statusMsg = document.getElementById('statusMsg');

        function showMessage(msg, isError = true) {
            statusMsg.textContent = msg;
            statusMsg.style.color = isError ? '#ff8888' : '#88ff88';
            setTimeout(() => { statusMsg.textContent = ''; }, 4000);
        }

        // Проверка сессии на сервере (Discord/Epic)
        async function checkServerSession() {
            try {
                const res = await fetch('/api/user');
                const data = await res.json();
                if (data.loggedIn) {
                    showCalculator(data.user);
                    return true;
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        function showCalculator(user) {
            authPanel.style.display = 'none';
            calculatorPanel.style.display = 'block';
            userInfo.style.display = 'flex';
            userNameSpan.textContent = user.global_name || user.username || user.email;
            userEmailSpan.textContent = user.email || '';
            if (user.avatar) {
                userAvatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
            } else if (user.provider === 'epic') {
                userAvatar.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
            } else {
                userAvatar.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
            }
        }

        function showAuth() {
            authPanel.style.display = 'block';
            calculatorPanel.style.display = 'none';
            userInfo.style.display = 'none';
        }

        // Вход через Discord (серверный)
        discordLoginBtn.addEventListener('click', () => {
            window.location.href = '/auth/discord';
        });

        // Вход через Epic Games (серверный)
        epicLoginBtn.addEventListener('click', () => {
            window.location.href = '/auth/epic';
        });

        // Вход через Google (Firebase)
        googleLoginBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                showMessage(`Добро пожаловать, ${result.user.displayName || result.user.email}!`, false);
                setTimeout(() => location.reload(), 1500);
            } catch (error) {
                showMessage('' + error.message);
            }
        });

        // Вход по email/паролю
        loginSubmit.addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                showMessage('Заполните email и пароль');
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage('Вход выполнен!', false);
                setTimeout(() => location.reload(), 1500);
            } catch (error) {
                showMessage('' + (error.code === 'auth/invalid-credential' ? 'Неверный email или пароль' : error.message));
            }
        });

        // Регистрация
        registerSubmit.addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            if (!email || !password) {
                showMessage('Заполните email и пароль');
                return;
            }
            if (password.length < 6) {
                showMessage('Пароль должен быть не менее 6 символов');
                return;
            }
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(userCredential.user);
                showMessage('Регистрация успешна! Подтвердите email по ссылке в письме', false);
                setTimeout(() => location.reload(), 3000);
            } catch (error) {
                showMessage('' + (error.code === 'auth/email-already-in-use' ? 'Этот email уже зарегистрирован' : error.message));
            }
        });

        // Переключение форм
        showRegister?.addEventListener('click', () => {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        });
        showLogin?.addEventListener('click', () => {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        // Выход
        logoutBtn.addEventListener('click', async () => {
            if (auth.currentUser) {
                await signOut(auth);
            }
            window.location.href = '/logout';
        });

        // Главная проверка
        onAuthStateChanged(auth, async (firebaseUser) => {
            const serverSession = await checkServerSession();
            if (firebaseUser && !serverSession) {
                showCalculator({
                    username: firebaseUser.displayName,
                    email: firebaseUser.email,
                    avatar: null,
                    id: firebaseUser.uid,
                    global_name: firebaseUser.displayName,
                    provider: 'firebase'
                });
            } else if (!firebaseUser && !serverSession) {
                showAuth();
            }
        });

        checkServerSession();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050508;
            font-family: 'Poppins', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 100, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%),
                        radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 500px;
            width: 90%;
            margin: 40px auto;
            position: relative;
            z-index: 1;
        }
        .panel {
            background: rgba(30, 31, 44, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255, 217, 102, 0.2);
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd966 0%, #ff8800 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: 0.2s;
        }
        .btn-discord {
            background: #5865F2;
            color: white;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.3);
        }
        .btn-discord:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
        }
        .btn-epic {
            background: #171717;
            color: white;
            border: 1px solid rgba(255,217,102,0.3);
        }
        .btn-epic:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        .btn-google {
            background: #4285f4;
            color: white;
            box-shadow: 0 0 10px rgba(66, 133, 244, 0.3);
        }
        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(66, 133, 244, 0.5);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd966, #ff8800);
            color: #0f0f17;
            box-shadow: 0 0 15px rgba(255, 136, 0, 0.3);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(255, 136, 0, 0.5);
        }
        .btn-secondary {
            background: rgba(42, 43, 58, 0.8);
            color: #ffd966;
            border: 1px solid rgba(255, 217, 102, 0.3);
        }
        .btn-secondary:hover {
            background: #2a2b3a;
            transform: scale(1.02);
        }
        .auth-divider {
            margin: 24px 0;
            text-align: center;
            border-top: 1px solid rgba(255, 217, 102, 0.2);
            position: relative;
        }
        .auth-divider span {
            background: #1e1f2c;
            padding: 0 10px;
            position: relative;
            top: -10px;
            color: #888;
            font-size: 12px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2a2b3a;
            border: 1px solid #3d3e52;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }
        .auth-form input:focus {
            outline: none;
            border-color: #ffd966;
            box-shadow: 0 0 10px rgba(255, 217, 102, 0.3);
        }
        .toggle-auth {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
        }
        .toggle-auth a {
            color: #ffd966;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .toggle-auth a:hover {
            text-shadow: 0 0 8px rgba(255, 217, 102, 0.5);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(42, 43, 58, 0.8);
            border-radius: 24px;
            border: 1px solid rgba(255, 217, 102, 0.2);
        }
        .user-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ffd966;
        }
        .user-info h3 {
            color: #ffd966;
            font-size: 16px;
        }
        .user-info p {
            color: #aaa;
            font-size: 12px;
        }
        .calculator-placeholder {
            margin-top: 24px;
            padding: 32px;
            background: rgba(42, 43, 58, 0.6);
            border-radius: 24px;
            text-align: center;
            color: #888;
            border: 1px solid rgba(255, 217, 102, 0.1);
            font-size: 14px;
        }
        #statusMsg {
            margin-top: 16px;
            font-size: 12px;
            min-height: 40px;
        }
        @media (max-width: 600px) {
            .container { width: 95%; margin: 20px auto; }
            .panel { padding: 24px; }
            h1 { font-size: 24px; }
            .btn { padding: 10px; font-size: 14px; }
            .auth-form input { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Панель авторизации -->
    <div id="authPanel" class="panel">
        <h1>⚡ FORTNITE LANDING</h1>
        <p class="subtitle">Войдите, чтобы использовать калькулятор</p>

        <button id="discordLogin" class="btn btn-discord">Войти через Discord</button>
        <button id="epicLogin" class="btn btn-epic">Войти через Epic Games</button>
        <button id="googleLogin" class="btn btn-google">Войти через Google</button>

        <div class="auth-divider"><span>или</span></div>

        <div id="loginForm" class="auth-form">
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button id="loginSubmit" class="btn btn-primary">Войти</button>
            <div class="toggle-auth">Нет аккаунта? <a id="showRegister">Зарегистрироваться</a></div>
        </div>

        <div id="registerForm" class="auth-form" style="display: none;">
            <input type="email" id="registerEmail" placeholder="Email">
            <input type="password" id="registerPassword" placeholder="Пароль (мин. 6 символов)">
            <button id="registerSubmit" class="btn btn-primary">Зарегистрироваться</button>
            <div class="toggle-auth">Уже есть аккаунт? <a id="showLogin">Войти</a></div>
        </div>

        <div id="statusMsg"></div>
    </div>

    <!-- Панель калькулятора (после входа) -->
    <div id="calculatorPanel" class="panel" style="display: none;">
        <div id="userInfo" class="user-info" style="display: none;">
            <img id="userAvatar" src="" alt="Avatar">
            <div>
                <h3 id="userName"></h3>
                <p id="userEmail"></p>
            </div>
        </div>

        <h1>🗺️ FORTNITE LANDING</h1>

        <div class="calculator-placeholder">
            ✅ Ты авторизован!<br><br>
            🎯 Скоро здесь появится калькулятор<br>
            📌 А пока можешь перейти на <a href="/dashboard" style="color: #ffd966;">страницу карты</a>
        </div>

        <button id="logoutBtn" class="btn btn-secondary" style="margin-top: 24px;">🚪 Выйти</button>
    </div>
</div>

</body>
</html>
