<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выбор оплаты — Fortnite Landing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050508;
            font-family: 'Poppins', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 100, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%),
                        radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }
        .checkout-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .checkout-card {
            background: rgba(30, 31, 44, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd966 0%, #ff8800 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .price {
            font-size: 48px;
            font-weight: bold;
            color: #ffd966;
            margin: 16px 0;
        }
        .price small {
            font-size: 18px;
            color: #aaa;
        }
        
        /* Стили выбора способа оплаты */
        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 32px 0;
        }
        .payment-method {
            background: rgba(42, 43, 58, 0.6);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 217, 102, 0.2);
            transition: 0.2s;
            cursor: pointer;
        }
        .payment-method:hover {
            border-color: #ffd966;
            background: rgba(42, 43, 58, 0.8);
            transform: translateY(-2px);
        }
        .payment-method h3 {
            color: #ffd966;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .payment-method p {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .btn-pay {
            background: linear-gradient(135deg, #ffd966, #ff8800);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            color: #0f0f17;
            box-shadow: 0 0 15px rgba(255, 136, 0, 0.3);
        }
        .btn-pay:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(255, 136, 0, 0.5);
        }
        .btn-yoomoney {
            background: #1a4d8c;
            color: white;
            box-shadow: 0 0 10px rgba(26, 77, 140, 0.3);
        }
        .btn-yoomoney:hover {
            background: #1a5a9e;
            box-shadow: 0 0 15px rgba(26, 77, 140, 0.5);
        }
        .crypto-icons {
            margin-top: 16px;
            font-size: 24px;
            color: #aaa;
        }
        .back-link {
            display: block;
            margin-top: 24px;
            color: #ffd966;
            text-decoration: none;
            transition: 0.2s;
        }
        .back-link:hover {
            text-shadow: 0 0 8px rgba(255, 217, 102, 0.5);
        }
        .error-msg {
            color: #ff8888;
            font-size: 12px;
            margin-top: 16px;
            display: none;
        }
        .success-msg {
            color: #88ff88;
            font-size: 12px;
            margin-top: 16px;
            display: none;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            body { padding: 20px; }
            .checkout-card { padding: 32px; }
            .price { font-size: 36px; }
        }
    </style>
</head>
<body>
<div class="checkout-container">
    <div class="checkout-card">
        <h1>💎 ОФОРМЛЕНИЕ ПОДПИСКИ</h1>
        <p class="subtitle">Выберите способ оплаты</p>

        <div class="price">
            500 ₽ <small>/ месяц</small>
        </div>

        <div class="payment-methods">
            <!-- Способ 1: ЮMoney (карта/СБП) -->
            <div class="payment-method">
                <h3>💳 Банковская карта / СБП</h3>
                <p>Оплата через ЮMoney — быстро и безопасно</p>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="yoomoneyType" value="AC" checked> 💳 Банковская карта
                    </label>
                    <label>
                        <input type="radio" name="yoomoneyType" value="PC"> 💰 Кошелек ЮMoney
                    </label>
                </div>
                <form id="yoomoneyForm" method="POST" action="https://yoomoney.ru/quickpay/confirm" style="display: none;">
                    <input type="hidden" name="receiver" id="yoomoneyReceiver" value="4100112345678910">
                    <input type="hidden" name="quickpay-form" value="button">
                    <input type="hidden" name="sum" value="500">
                    <input type="hidden" name="label" value="premium_subscription">
                    <input type="hidden" name="successURL" value="https://fortnite-landing-calculator.onrender.com/success">
                    <input type="hidden" name="paymentType" id="yoomoneyPaymentType" value="AC">
                </form>
                <button id="yoomoneyPayBtn" class="btn-pay btn-yoomoney">💳 Оплатить 500 ₽</button>
            </div>

            <!-- Способ 2: CryptoCloud (криптовалюта) -->
            <div class="payment-method">
                <h3>₿ Криптовалюта</h3>
                <p>USDT, BTC, ETH и другие криптовалюты</p>
                <button id="cryptoPayBtn" class="btn-pay">💎 Оплатить криптовалютой</button>
                <div class="crypto-icons">
                    ₿ 🟡 Ξ 💎
                </div>
            </div>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <a href="/premium" class="back-link">← Вернуться к выбору тарифа</a>
    </div>
</div>

<script>
    (function() {
        // ========== ЮMONEY ==========
        // Номер кошелька ЮMoney (ЗАМЕНИ НА СВОЙ!)
        const YOOMONEY_RECEIVER = '4100112345678910';
        
        const yoomoneyForm = document.getElementById('yoomoneyForm');
        const yoomoneyPayBtn = document.getElementById('yoomoneyPayBtn');
        const yoomoneyPaymentType = document.getElementById('yoomoneyPaymentType');
        const radioButtons = document.querySelectorAll('input[name="yoomoneyType"]');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        
        function showError(text) {
            errorMsg.textContent = text;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(text) {
            successMsg.textContent = text;
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
        
        // Устанавливаем номер получателя
        const receiverInput = document.querySelector('input[name="receiver"]');
        if (receiverInput) {
            receiverInput.value = YOOMONEY_RECEIVER;
        }
        
        // Обновляем скрытое поле при выборе способа оплаты
        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                yoomoneyPaymentType.value = radio.value;
            });
        });
        
        // Обработчик кнопки ЮMoney
        yoomoneyPayBtn.addEventListener('click', () => {
            yoomoneyForm.submit();
        });
        
        // ========== CRYPTOCLOUD ==========
        const cryptoPayBtn = document.getElementById('cryptoPayBtn');
        let cryptoWidgetReady = false;
        
        // Загружаем CryptoCloud виджет
        const script = document.createElement('script');
        script.src = 'https://widget.cryptocloud.plus/v2/widget.js';
        script.async = true;
        
        script.onload = () => {
            if (typeof CryptoCloudWidget !== 'undefined') {
                cryptoWidgetReady = true;
                console.log('✅ CryptoCloud виджет загружен');
            } else {
                showError('❌ Ошибка загрузки платёжной системы. Обновите страницу.');
            }
        };
        
        script.onerror = () => {
            showError('❌ Не удалось загрузить платёжную систему. Проверьте интернет-соединение.');
        };
        
        document.body.appendChild(script);
        
        // Обработчик кнопки криптооплаты
        cryptoPayBtn.addEventListener('click', () => {
            if (!cryptoWidgetReady) {
                showError('⏳ Платёжная система ещё загружается. Попробуйте через секунду.');
                return;
            }
            
            try {
                CryptoCloudWidget.createInvoice({
                    // 🔑 ЗАМЕНИ НА СВОЙ SHOP_ID ИЗ КАБИНЕТА CRYPTOCLOUD
                    shop_id: '2bK0J89q9avkghEU',
                    amount: 500,
                    currency: 'RUB',
                    order_id: 'crypto_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8),
                    description: 'Подписка на Fortnite Landing Calculator',
                    lang: 'ru',
                    theme: 'dark',
                    onSuccess: function(data) {
                        console.log('Оплата успешна:', data);
                        localStorage.setItem('fortnite_subscription', 'active');
                        localStorage.setItem('subscription_start', Date.now());
                        window.location.href = '/dashboard?subscription=active';
                    },
                    onFail: function(data) {
                        console.log('Оплата не удалась:', data);
                        showError('❌ Оплата не была завершена. Попробуйте ещё раз.');
                    }
                });
            } catch (error) {
                console.error('CryptoCloud error:', error);
                showError('❌ Ошибка при создании счёта. Попробуйте позже.');
            }
        });
        
        // Проверка подписки при загрузке (если уже есть активная)
        const isSubscribed = localStorage.getItem('fortnite_subscription') === 'active';
        const start = parseInt(localStorage.getItem('subscription_start'));
        const isExpired = start && (Date.now() - start > 30 * 24 * 60 * 60 * 1000);
        
        if (isSubscribed && !isExpired) {
            showSuccess('✅ У вас уже есть активная подписка! Перенаправление...');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 2000);
        } else if (isSubscribed && isExpired) {
            localStorage.removeItem('fortnite_subscription');
            localStorage.removeItem('subscription_start');
        }
    })();
</script>
</body>
</html>
